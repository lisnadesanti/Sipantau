<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin DLH - SIPANTAU</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            overflow: hidden;
            max-width: 400px;
            width: 100%;
            padding: 35px 30px;
        }
        .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.4rem;
            color: #1f4720;
            margin-bottom: 25px;
        }
        .btn-login {
            background-color: #1f4720;
            color: #ffffff;
            font-weight: 600;
            border-radius: 8px;
            padding: 10px;
            width: 100%;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-login:hover {
            background-color: #153216;
            color: #ffffff;
        }
        .form-control:focus {
            border-color: #1f4720;
            box-shadow: 0 0 0 0.25rem rgba(31, 71, 32, 0.15);
        }
    </style>
</head>
<body>

<div class="login-card">
    <!-- Logo Header -->
    <div class="brand-logo">
        <img src="{{ url_for('static', filename='img/logosipsn_prediction.png') }}" alt="Logo SIPANTAU" width="38">
        SIPANTAU
    </div>

    <h5 class="fw-bold text-center mb-1 text-dark">LOGIN ADMIN DLH</h5>
    <p class="text-muted text-center small mb-4">Masuk untuk mengelola sistem prediksi.</p>

    <!-- Notifikasi jika Username/Password Salah -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show p-2 small" role="alert">
            {{ message }}
            <button type="button" class="btn-close p-2" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Form Login -->
    <form action="/login" method="POST">
        <div class="mb-3">
            <label class="form-label small fw-medium text-secondary">Username</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-secondary"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control" placeholder="admin" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-medium text-secondary">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-secondary"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn btn-login mb-3">Login Admin</button>
    </form>

    <div class="text-center">
        <a href="/" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left me-1"></i> Kembali ke Beranda Publik</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
